<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeyfile Intrusion Detection System</title>
    <style>
        :root {
            --bg: #0a0e1a;
            --bg-elevated: #0f1419;
            --bg-card: #141920;
            --border: #1e2530;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-hover: #34d399;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
        }

        .back-link {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            margin: -20px -20px 20px -20px;
        }

        .back-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-link a:hover {
            color: var(--accent-hover);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-elevated);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        #content h1 {
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--border);
        }

        #content h2 {
            color: var(--text);
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        #content h3 {
            color: var(--text);
            font-size: 1.2rem;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        #content p {
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        #content ul, #content ol {
            color: var(--text-muted);
            margin-left: 2rem;
            margin-bottom: 1rem;
        }

        #content li {
            margin-bottom: 0.5rem;
        }

        #content pre {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        #content code {
            font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.9em;
            color: var(--accent);
        }

        #content pre code {
            color: var(--text);
        }

        #content a {
            color: var(--accent);
            text-decoration: none;
        }

        #content a:hover {
            text-decoration: underline;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        #content th, #content td {
            padding: 0.75rem;
            border: 1px solid var(--border);
            text-align: left;
        }

        #content th {
            background: var(--bg-card);
            font-weight: 600;
            color: var(--text);
        }

        #content td {
            color: var(--text-muted);
        }

        #content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--text-muted);
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="index.html">← Zurück zur Dokumentation</a>
    </div>

    <div class="container">
        <div id="content" class="loading">Lade Dokumentation...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // marked.js konfigurieren
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true
        });

        // Markdown-Datei laden und rendern
        fetch('HONEYFILE_SETUP.md')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Markdown-Datei nicht gefunden');
                }
                return response.text();
            })
            .then(markdown => {
                document.getElementById('content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                document.getElementById('content').innerHTML = 
                    '<div style="color: #ef4444;"><strong>Fehler beim Laden:</strong> ' + 
                    error.message + '</div>';
            });
    </script>
</body>
</html>
